[project]
name = "ca-cdk8s-constructs"
version = "3.0.1"
description = "A collection of cdk8s constructs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cdk8s>=2.70.7",
    "cdk8s-plus-32>=2.4.0",
    "pyyaml>=6.0.2",
    "aws-cdk-lib>=2.212.0",
]

[dependency-groups]
dev = [
  "ty>=0.0.1a19",
  "syrupy>=4.9.1",
  "pytest>=8.4.1",
  "ruff>=0.12.10"
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ca_cdk8s_constructs"
module-root = "."

[tool.ruff]
# Exclude the imports directory as it is generated by cdk8s
exclude = ["ca_cdk8s_constructs/imports"]
line-length = 95

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint]
ignore = ['E501']
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "N",   # pep8-naming
    "I",   # isort
    "RUF", # Ruff specific rules
]

[tool.ty.environment]
python = "./.venv"
root = ["ca_cdk8s_constructs"]